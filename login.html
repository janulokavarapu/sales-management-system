<!DOCTYPE html>
<html>

<head>

    <title>Login - Sales Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Sales & Stock Management System</h1>

    <h2>🔐 Admin Login</h2>

    <form method="POST">

        <label>Username:</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password:</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

        <p><strong>{{ error }}</strong></p>

    {% endif %}

</body>

</html>
