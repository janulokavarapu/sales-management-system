<!DOCTYPE html>
<html>
<head>
    <title>Add Product - Sales Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Sales & Stock Management System</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/add-product">Add Product</a>
        <a href="/sales">Sales</a>
        <a href="/reports">Reports</a>
    </nav>

    <h2>Add Product</h2>

    <form method="POST">

        <label>Product Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Category:</label>
        <input type="text" name="category">

        <br><br>

        <label>Purchase Price:</label>
        <input type="number" name="purchase_price" step="0.01" required>

        <br><br>

        <label>Selling Price:</label>
        <input type="number" name="selling_price" step="0.01" required>

        <br><br>

        <label>Quantity:</label>
        <input type="number" name="quantity" required>

        <br><br>

        <label>Minimum Stock:</label>
        <input type="number" name="minimum_stock" required>

        <br><br>

        <button type="submit">Add Product</button>

    </form>

</body>
</html>
